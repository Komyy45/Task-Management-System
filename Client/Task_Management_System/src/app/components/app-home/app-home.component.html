<div class="app-container">
  <app-sidebar
    [collapsed]="isSidebarCollapsed"
    (toggleSidebar)="toggleSidebar()"
  ></app-sidebar>
  <div class="content-container" [ngClass]="{ expanded: isSidebarCollapsed }">
    <div
      class="content-wrapper"
      [@fadeRouteAnimation]="o.isActivated ? o.activatedRoute : ''"
    >
      <router-outlet #o="outlet"></router-outlet>
    </div>
  </div>
</div>
