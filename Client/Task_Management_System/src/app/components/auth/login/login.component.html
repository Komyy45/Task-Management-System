<div class="container mt-5" [@fadeInOut]>
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow" [@formState]="formState">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Welcome Back</h2>
            <p class="text-secondary">Sign in to your account to continue</p>
          </div>

          <form
            [formGroup]="loginForm"
            (ngSubmit)="onSubmit()"
            (focus)="onFocus()"
            (blur)="onBlur()"
          >
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-envelope"></i>
                </span>
                <input
                  type="email"
                  formControlName="email"
                  class="form-control"
                  [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
                  placeholder="name@example.com"
                  autocomplete="email"
                />
              </div>
              <div
                *ngIf="submitted && f['email'].errors"
                class="invalid-feedback d-block"
              >
                <div *ngIf="f['email'].errors['required']">
                  Email is required
                </div>
                <div *ngIf="f['email'].errors['email']">
                  Please enter a valid email address
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>
                <input
                  type="password"
                  formControlName="password"
                  class="form-control"
                  [ngClass]="{
                    'is-invalid': submitted && f['password'].errors
                  }"
                  placeholder="••••••"
                  autocomplete="current-password"
                />
              </div>
              <div
                *ngIf="submitted && f['password'].errors"
                class="invalid-feedback d-block"
              >
                <div *ngIf="f['password'].errors['required']">
                  Password is required
                </div>
                <div *ngIf="f['password'].errors['minlength']">
                  Password must be at least 6 characters
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="rememberMe"
                />
                <label class="form-check-label" for="rememberMe"
                  >Remember me</label
                >
              </div>
              <a href="#" class="text-primary fw-semibold text-decoration-none"
                >Forgot Password?</a
              >
            </div>

            <div class="alert alert-danger" *ngIf="errorMessage" [@fadeInOut]>
              {{ errorMessage }}
            </div>

            <div
              class="alert alert-success"
              *ngIf="successMessage"
              [@fadeInOut]
            >
              {{ successMessage }}
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2 mt-3"
              [disabled]="loading"
            >
              <span
                *ngIf="loading"
                class="spinner-border spinner-border-sm me-2"
                role="status"
                aria-hidden="true"
              ></span>
              Sign In
            </button>
          </form>

          <div class="text-center mt-4">
            <p>
              Don't have an account?
              <a routerLink="/auth/register" class="text-primary fw-bold"
                >Sign Up</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
